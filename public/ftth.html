<!DOCTYPE html>
<html lang="id">
<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#DC2626">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📡</text></svg>">
    <title>Jaringan FTTH - MAYUNG</title>
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <link rel="stylesheet" href="css/style.css?v=57">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body class="with-sidebar">
    <a href="#main" class="skip-nav">Langsung ke konten</a>
    <div id="navbar"></div>
    <div id="main" class="dashboard-container">
        <h1 class="sr-only">Jaringan FTTH</h1>
        <div id="ftthHome"></div>
        <div id="ftthDetail" class="hidden"></div>
    </div>

    <!-- Edit Modal -->
    <div id="editModal" class="modal" role="dialog" aria-modal="true" aria-label="Edit perangkat">
        <div class="modal-content" style="max-width:450px;">
            <h3 id="editModalTitle">Edit</h3>
            <div class="modal-body">
                <label for="editLabel">Label</label>
                <input type="text" id="editLabel" class="field">
                <div id="editGroupWrap" class="ftth-field-wrap hidden">
                    <label for="editGroup">Group</label>
                    <input type="text" id="editGroup" class="field">
                </div>
                <div id="editPortWrap" class="ftth-field-wrap hidden">
                    <label for="editPort">Port di Induk</label>
                    <input type="text" id="editPort" class="field" placeholder="Contoh: Port 3/8">
                </div>
                <div id="editCoordWrap" class="ftth-field-wrap hidden">
                    <label for="editLat">Koordinat</label>
                    <div class="flex-row">
                        <input type="text" id="editLat" aria-label="Latitude" class="field flex-1" placeholder="Latitude">
                        <input type="text" id="editLng" aria-label="Longitude" class="field flex-1" placeholder="Longitude">
                    </div>
                </div>
                <div id="editBrandWrap" class="ftth-field-wrap hidden">
                    <label for="editBrand">Brand OLT</label>
                    <input type="text" id="editBrand" class="field" placeholder="Huawei/ZTE/FS">
                </div>
                <div id="editPortsWrap" class="ftth-field-wrap hidden">
                    <label for="editPorts">Jumlah Port</label>
                    <input type="number" id="editPorts" class="field" placeholder="16/32/48" min="1">
                </div>
                <div id="editSnWrap" class="ftth-field-wrap hidden">
                    <label for="editSn">Serial Number ONU</label>
                    <input type="text" id="editSn" class="field" placeholder="SN ONU">
                </div>
            </div>
            <div class="flex-end">
                <button class="btn-secondary" id="cancelEditBtn">Batal</button>
                <button class="login-btn" id="saveEditBtn">Save</button>
            </div>
        </div>
    </div>

    <!-- Add Modal -->
    <div id="addModal" class="modal" role="dialog" aria-modal="true" aria-label="Tambah perangkat">
        <div class="modal-content" style="max-width:520px;">
            <h3 id="addModalTitle">Tambah</h3>
            <div class="modal-body">
                <label for="addLabel">Label</label>
                <input type="text" id="addLabel" class="field" placeholder="Nama perangkat" autofocus>

                <div id="addGroupWrap" class="ftth-field-wrap hidden">
                    <label for="addGroup">Induk</label>
                    <select id="addGroup" class="field"></select>
                </div>

                <div id="addAvailPorts" class="ftth-field-wrap-sm hidden"></div>

                <div id="addPortWrap" class="ftth-field-wrap hidden">
                    <label for="addPort">Port di Induk</label>
                    <input type="text" id="addPort" class="field" placeholder="Klik port tersedia di atas" readonly>
                </div>

                <div id="addBrandWrap" class="ftth-field-wrap hidden">
                    <label for="addBrand">Brand OLT</label>
                    <input type="text" id="addBrand" class="field" placeholder="Huawei / ZTE / FS">
                </div>

                <div id="addPortsWrap" class="ftth-field-wrap hidden">
                    <label for="addPorts">Jumlah Port</label>
                    <input type="number" id="addPorts" class="field" placeholder="16 / 32 / 48" min="1">
                </div>

                <div id="addSnWrap" class="ftth-field-wrap hidden">
                    <label for="addSn">Serial Number ONU</label>
                    <input type="text" id="addSn" class="field" placeholder="SN ONU">
                </div>

                <div id="addCoordWrap" class="ftth-field-wrap">
                    <label >Koordinat (opsional)</label>
                    <div class="flex-row">
                        <input type="text" id="addLat" aria-label="Latitude" class="field flex-1" placeholder="Latitude">
                        <input type="text" id="addLng" aria-label="Longitude" class="field flex-1" placeholder="Longitude">
                    </div>
                </div>
            </div>
            <div class="flex-end">
                <button class="btn-secondary" id="cancelAddBtn">Batal</button>
                <button class="login-btn" id="saveAddBtn"><i class="fas fa-save"></i> Simpan</button>
            </div>
        </div>
    </div>

    <script src="js/constants.js?v=4"></script>
    <script src="js/csrf.js?v=1"></script>
    <script src="js/toast.js?v=5"></script>
    <script src="js/navbar.js?v=4"></script>
    <!-- jsPDF + autotable dimuat lazy via pdf-loader.js saat Export PDF diklik -->
    <script src="js/pdf-loader.js?v=1"></script>
    <script src="js/ftth.js?v=4"></script>
</body>
</html>
