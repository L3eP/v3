<!doctype html>
<html lang="id">

<head>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#DC2626" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📡</text></svg>">
  <title>Activity - MAYUNG</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
  <link rel="stylesheet" href="css/style.css?v=55" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
</head>

<body class="with-sidebar">
  <a href="#main" class="skip-nav">Langsung ke konten</a>
  <div id="navbar"></div>

  <div id="main" class="dashboard-container">
    <!-- Activity Form -->
    <div class="activity-form-card">
      <h1 class="page-title activity-page-title">Log New Activity</h1>
      <form id="activityForm">
        <label for="activityDescription">Description</label>
        <div class="activity-form-row">
          <input type="text" id="activityDescription" required placeholder="What did you work on?" />
          <select id="ticket_id" name="ticket_id" aria-label="Pilih tiket">
            <option value="">Choose Ticket</option>
          </select>
        </div>
        <button type="submit" class="login-btn activity-form-submit">
          Save Activity
        </button>
      </form>
    </div>

    <!-- Activity List -->
    <div class="activity-list-card">
      <div class="card-header activity-card-header-ext" style="flex-direction: column; justify-content: flex-start;">
        <h2 class="card-title">Activity History</h2>
        <div class="activity-search-box" style="width: 100%; max-width: 100%;">
          <div class="search-wrap" style="width: 100%;">
            <i class="fas fa-search"></i>
            <input type="text" id="activitySearch" class="filter-select" placeholder="Cari aktivitas..."
              aria-label="Cari aktivitas" style="width: 100%;">
          </div>
        </div>
        <div class="activity-date-box" style="width: 100%; display: flex; align-items: center; gap: 8px;">
          <input type="date" id="activityStartDate" class="filter-select activity-date-input" title="Start Date"
            style="flex: 1; width: 100%;">
          <span class="text-muted-sm">—</span>
          <input type="date" id="activityEndDate" class="filter-select activity-date-input" title="End Date"
            style="flex: 1; width: 100%;">
        </div>
        <div class="export-buttons">
          <button id="exportCsvBtn" class="btn-export btn-csv">
            Export CSV
          </button>
          <button id="exportPdfBtn" class="btn-export btn-pdf">
            Export PDF
          </button>
        </div>
      </div>
      <div class="table-responsive">
        <ul class="activity-list" id="activityList">
          <!-- Populated by JS -->
        </ul>
        <div id="emptyState" class="empty-state hidden">
          <i class="fas fa-history"></i>
          <p>No activities found.</p>
        </div>
      </div>
      <nav aria-label="Pagination daftar aktivitas">
        <ul class="pagination" id="activityPagination"></ul>
      </nav>
    </div>
  </div>

  <script src="js/constants.js?v=2"></script>
  <script src="js/csrf.js?v=1"></script>
  <script src="js/toast.js?v=5"></script>
  <script src="js/navbar.js?v=4"></script>
  <!-- jsPDF + autotable dimuat lazy via pdf-loader.js saat Export PDF diklik -->
  <script src="js/pdf-loader.js?v=1"></script>
  <script src="js/activity.js?v=4"></script>
</body>

</html>
