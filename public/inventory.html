<!DOCTYPE html>
<html lang="id">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#DC2626">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📡</text></svg>">
    <title>Inventory - MAYUNG</title>
  <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <link rel="stylesheet" href="css/style.css?v=57">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css">
</head>
<body class="with-sidebar">
    <a href="#main" class="skip-nav">Langsung ke konten</a>
  <div id="navbar"></div>
  <div id="main" class="dashboard-container">
    <div style="margin-bottom:24px;">
      <h1 class="page-title"><i class="fas fa-boxes" style="color:var(--accent-cyan);"></i> Inventory</h1>
      <p class="page-sub">Manajemen stok perangkat</p>
    </div>

    <div class="inv-grid">
      <div class="inv-card" style="grid-column:1/-1;">
        <h2 style="margin:0 0 16px 0;font-size:1.125rem;display:flex;flex-wrap:wrap;align-items:center;gap:12px;">
          <i class="fas fa-list" style="color:var(--accent-cyan);"></i> Daftar Stok
          <span id="invCount" style="font-weight:400;color:var(--text-muted);font-size:.9rem;"></span>
          <div class="export-buttons">
            <button class="btn-export btn-csv" onclick="exportCsv()">CSV</button>
            <button class="btn-export btn-pdf" onclick="exportPdf()">PDF</button>
            <button id="invAddBtn" class="login-btn" style="width:auto;"><i class="fas fa-plus-circle"></i> Tambah Item</button>
          </div>
        </h2>
        <div id="invListContainer" style="max-height:600px;overflow-y:auto;"></div>
      </div>
    </div>
  </div>

  <!-- Add Inventory Modal -->
  <div id="addInvModal" class="modal" role="dialog" aria-modal="true" aria-label="Tambah Item Inventory">
    <div class="modal-content" style="max-width:450px;text-align:left;">
      <h3 style="margin:0 0 16px 0;color:var(--accent-cyan);"><i class="fas fa-plus-circle"></i> Tambah Item Inventory</h3>
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="flex-row">
          <div class="flex-1">
            <label class="field-label" for="invDeviceType">Tipe Perangkat</label>
            <select id="invDeviceType" class="field">
              <option value="">Pilih Tipe</option>
            </select>
          </div>
          <div class="flex-2">
            <label class="field-label" for="invDeviceName">Nama/model perangkat</label>
            <input type="text" id="invDeviceName" placeholder="Nama/model perangkat" class="field">
          </div>
        </div>
        <!-- Field dinamis per tipe -->
        <div id="invAddAttrs" style="display:none;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--input-border);border-radius:8px;background:var(--bg-subtle);"></div>
        <div class="flex-row">
          <div class="flex-1">
            <label class="field-label" for="invTotalStock">Jumlah stok</label>
            <input type="number" id="invTotalStock" placeholder="Jumlah stok" class="field" min="0">
          </div>
          <div class="flex-2">
            <label class="field-label" for="invLocation">Lokasi penyimpanan</label>
            <input type="text" id="invLocation" placeholder="Lokasi penyimpanan" class="field">
          </div>
        </div>
        <div>
          <label class="field-label" for="invNotes">Catatan (opsional)</label>
          <textarea id="invNotes" rows="2" placeholder="Catatan (opsional)" class="field resize-v"></textarea>
        </div>
      </div>
      <div class="form-footer">
        <button class="btn-secondary" onclick="document.getElementById('addInvModal').classList.remove('show')">Batal</button>
        <button id="invSubmitBtn" class="login-btn" style="width:auto;"><i class="fas fa-save"></i> Tambah</button>
      </div>
    </div>
  </div>

  <!-- Edit Inventory Modal -->
  <div id="editInvModal" class="modal" role="dialog" aria-modal="true" aria-label="Edit Item Inventory">
    <div class="modal-content" style="max-width:450px;text-align:left;">
      <h3 style="margin:0 0 16px 0;color:var(--accent-cyan);"><i class="fas fa-edit"></i> Edit Item Inventory</h3>
      <form id="editInvForm" style="display:flex;flex-direction:column;gap:10px;">
        <input type="hidden" id="editInvId">
        <div class="flex-row">
          <div class="flex-1">
            <label class="field-label" for="editInvDeviceType">Tipe Perangkat</label>
            <select id="editInvDeviceType" class="field">
              <option value="">Pilih Tipe</option>
            </select>
          </div>
          <div class="flex-2">
            <label class="field-label" for="editInvDeviceName">Nama/model perangkat</label>
            <input type="text" id="editInvDeviceName" placeholder="Nama/model perangkat" class="field">
          </div>
        </div>
        <!-- Field dinamis per tipe -->
        <div id="editInvAttrs" style="display:none;flex-direction:column;gap:8px;padding:10px;border:1px dashed var(--input-border);border-radius:8px;background:var(--bg-subtle);"></div>
        <div class="flex-row">
          <div class="flex-1">
            <label class="field-label" for="editInvTotalStock">Total stok</label>
            <input type="number" id="editInvTotalStock" placeholder="Total stok" class="field" min="0">
          </div>
          <div class="flex-1">
            <label class="field-label" for="editInvUsedStock">Stok terpakai</label>
            <input type="number" id="editInvUsedStock" placeholder="Stok terpakai" class="field" min="0">
          </div>
        </div>
        <div>
          <label class="field-label" for="editInvLocation">Lokasi penyimpanan</label>
          <input type="text" id="editInvLocation" placeholder="Lokasi penyimpanan" class="field">
        </div>
        <div>
          <label class="field-label" for="editInvNotes">Catatan (opsional)</label>
          <textarea id="editInvNotes" rows="2" placeholder="Catatan (opsional)" class="field resize-v"></textarea>
        </div>
        <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:8px;">
          <button type="button" class="btn-secondary" onclick="document.getElementById('editInvModal').classList.remove('show')">Batal</button>
          <button type="submit" class="login-btn" style="width:auto;"><i class="fas fa-save"></i> Simpan</button>
        </div>
      </form>
    </div>
  </div>

  <script src="js/constants.js?v=3"></script>
  <script src="js/csrf.js?v=1"></script>
  <script src="js/toast.js?v=5"></script>
  <!-- jsPDF + autotable dimuat lazy via pdf-loader.js saat Export PDF diklik -->
  <script src="js/pdf-loader.js?v=1"></script>
  <script src="js/navbar.js?v=4"></script>
  <script src="js/inventory.js?v=3"></script>
</body>
</html>
