<!doctype html>
<html lang="id">
  <head>
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#DC2626" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>📡</text></svg>">
    <title>PSB - MAYUNG</title>
    <script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark'||(!t&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script>
    <link rel="stylesheet" href="css/style.css?v=56" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="vendor/fontawesome/css/all.min.css" />
  </head>
  <body class="with-sidebar">
    <a href="#main" class="skip-nav">Langsung ke konten</a>
    <div id="navbar"></div>

    <div id="main" class="dashboard-container">
      <div style="margin-bottom:24px;">
        <h1 class="page-title"><i class="fas fa-file-alt" style="color:var(--accent-rose);"></i> PSB / Pemasangan Baru</h1>
        <p class="page-sub">Daftarkan pelanggan baru dan pencatatan ONU</p>
      </div>

      <div class="psb-grid">
        <!-- List only — form pindah ke modal -->
        <div style="grid-column:1/-1;">
          <div class="psb-list-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:10px;">
              <h2 style="margin:0;font-size:1.125rem;"><i class="fas fa-list" style="color:var(--accent-blue);"></i> Daftar PSB <span id="psbCount" style="font-weight:400;color:var(--text-muted);font-size:.9rem;">(0)</span></h2>
              <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
                <input type="text" id="psbSearch" class="filter-select" placeholder="Cari pelanggan..." aria-label="Cari pelanggan" style="width:220px;" oninput="filterPsb()">
                <button id="psbAddBtn" class="login-btn" style="width:auto;"><i class="fas fa-plus-circle"></i> Tambah PSB</button>
              </div>
            </div>
            <div id="psbListContainer">
              <div class="psb-empty">
                <i class="fas fa-inbox"></i>
                <p>Belum ada pendaftaran</p>
              </div>
            </div>
            <nav aria-label="Pagination daftar PSB">
              <ul class="pagination" id="psbPagination"></ul>
            </nav>
          </div>
        </div>
      </div>
    </div>

    <!-- Add PSB Modal -->
    <div id="addPsbModal" class="modal" role="dialog" aria-modal="true" aria-label="Daftarkan PSB Baru">
      <div class="modal-content" style="max-width:500px;text-align:left;">
        <h3 style="color:var(--accent-rose);margin:0 0 16px 0;"><i class="fas fa-plus-circle"></i> Daftarkan PSB Baru</h3>
        <div style="display:flex;flex-direction:column;gap:10px;">
          <div>
            <label class="field-label" for="psbName">Nama Pelanggan</label>
            <input type="text" id="psbName" placeholder="Nama Pelanggan" class="field" required>
          </div>
          <div>
            <label class="field-label" for="psbAddress">Alamat</label>
            <textarea id="psbAddress" placeholder="Alamat" rows="2" class="field resize-v" required></textarea>
          </div>
          <div class="flex-row">
            <div class="flex-1">
              <label class="field-label" for="psbPhone">No Telepon</label>
              <input type="tel" id="psbPhone" placeholder="No Telepon" class="field" oninput="phoneOnly(this)" maxlength="16">
            </div>
            <div class="flex-1">
              <label class="field-label" for="psbOnuSn">SN ONU</label>
              <input type="text" id="psbOnuSn" placeholder="SN ONU" class="field">
            </div>
          </div>
          <div class="flex-row">
            <div class="flex-1">
              <label class="field-label" for="psbLat">Latitude</label>
              <input type="text" id="psbLat" placeholder="Latitude" class="field">
            </div>
            <div class="flex-1">
              <label class="field-label" for="psbLng">Longitude</label>
              <input type="text" id="psbLng" placeholder="Longitude" class="field">
            </div>
          </div>
          <div>
            <label class="field-label" for="psbOdp">ODP (opsional)</label>
            <select id="psbOdp" class="field">
              <option value="">Pilih Parent ODP (opsional)</option>
            </select>
          </div>
          <!-- Port ONU tersedia di ODP terpilih — list sama seperti saat
               menambah ONU di ftth.html (mereka pada dasarnya hal yang sama:
               menempatkan satu ONU di satu port ODP). -->
          <div id="psbPortWrap" class="hidden">
            <div class="ftth-port-head"><i class="fas fa-plug"></i> <span id="psbPortHead">Port ONU tersedia</span></div>
            <div id="psbAvailPorts" class="ftth-port-list"></div>
          </div>
          <div>
            <label class="field-label" for="psbPhoto">Foto Belakang Modem (opsional)</label>
            <input type="file" id="psbPhoto" accept="image/*" class="field" style="padding:6px;">
            <img id="psbPhotoPreview" alt="Pratinjau foto modem" src="data:image/gif;base64,R0lGODlhAQABAAD/ACwAAAAAAQABAAACADs=" style="display:none;max-width:150px;max-height:120px;margin-top:6px;border-radius:6px;">
          </div>
          <div>
            <label class="field-label" for="psbNotes">Catatan (opsional)</label>
            <textarea id="psbNotes" placeholder="Catatan (opsional)" rows="2" class="field resize-v"></textarea>
          </div>
        </div>
        <div class="form-footer">
          <button class="btn-secondary" onclick="document.getElementById('addPsbModal').classList.remove('show')">Batal</button>
          <button id="psbSubmitBtn" class="login-btn" style="width:auto;"><i class="fas fa-save"></i> Daftarkan PSB</button>
        </div>
      </div>
    </div>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="detailModalTitle">
      <div class="modal-content" style="max-width:500px;text-align:left;">
        <h3 id="detailModalTitle" style="color:var(--accent-rose);">Detail PSB</h3>
        <div id="detailModalBody" class="modal-body"></div>
        <button class="modal-ok-btn" onclick="document.getElementById('detailModal').classList.remove('show')">Tutup</button>
      </div>
    </div>

    <script src="js/constants.js?v=3"></script>
    <script src="js/csrf.js?v=1"></script>
    <script src="js/toast.js?v=5"></script>
    <script src="js/navbar.js?v=4"></script>
    <script src="js/psb.js?v=7"></script>
  </body>
</html>
