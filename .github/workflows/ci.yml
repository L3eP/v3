name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: login_app_db
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DB_HOST: 127.0.0.1
      DB_USER: root
      DB_PASSWORD: ''
      DB_NAME: login_app_db
      SESSION_SECRET: ci-test-secret
      NODE_ENV: test
      # FONNTE_TOKEN sengaja tidak di-set — test/helpers/testApp.js juga
      # meng-unset ini sendiri supaya tidak ada WhatsApp asli terkirim saat test.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Load schema + seed data
        run: |
          mysql -h 127.0.0.1 -u root < schema.sql
          mysql -h 127.0.0.1 -u root login_app_db < scripts/add_reference_table.sql
          mysql -h 127.0.0.1 -u root login_app_db < scripts/seed_ci_users.sql

      - name: Test
        run: npm test
